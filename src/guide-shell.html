.right{min-width:0;display:flex;flex-direction:column;min-height:0}.topbar{height:64px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:16px;background:var(--paper)}.breadcrumbs{min-width:0;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}.breadcrumbs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.breadcrumbs .sep{color:#baaaa0}.top-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}.offline{color:#8b796a;font-size:11px;background:#f3ede5;padding:3px 8px;border-radius:5px}.plain-button{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:6px;padding:6px 8px;color:var(--muted);font-size:12px}.plain-button:hover{background:var(--code)}.menu-button{display:none;border:1px solid var(--line);background:none;border-radius:6px;padding:7px}.reader{overflow:auto;min-height:0;flex:1;scroll-behavior:smooth;scrollbar-width:thin}.content-layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:minmax(0,810px) 180px;gap:46px;padding:48px 44px 38px}article{min-width:0}.eyebrow{font-size:11px;font-weight:650;color:var(--accent);letter-spacing:1.8px;margin-bottom:10px}h1{font-size:32px;line-height:1.35;letter-spacing:-.5px;font-weight:680;margin:0 0 14px;overflow-wrap:anywhere}.lead{font-size:15px;color:var(--muted);margin:0 0 17px;line-height:1.9}.article-meta{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:11px;color:#938273;margin:0 0 31px;padding-bottom:23px;border-bottom:1px solid var(--line)}.platform{background:#f2e8dd;color:#805840;border:1px solid #e7d8c8;border-radius:5px;padding:2px 8px;font-weight:550}.article-body>p{margin:16px 0;white-space:pre-line;overflow-wrap:anywhere}.article-body h2{font-size:21px;line-height:1.55;font-weight:650;margin:36px 0 15px;scroll-margin-top:25px}.article-body h2:first-child{margin-top:0}.article-body ul,.article-body ol{padding-left:22px;m display:block;text-decoration:none;color:#958271;font-size:11px;line-height:1.7;padding:5px 0 5px 13px;margin-left:-1px;border-left:2px solid transparent;overflow-wrap:anywhere}.toc a:hover,.toc a.active{color:var(--accent);border-left-color:#c77b58}.page-nav{border-top:1px solid var(--line);margin-top:45px;padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.page-nav a{border:1px solid var(--line);padding:12px 16px;border-radius:8px;text-decoration:none;color:#655143;font-size:13px}.page-nav a:hover{background:var(--sidebar);border-color:#cfb59e}.page-nav span{display:block;font-size:10px;color:#a08c7b;margin-bottom:2px}.page-nav a.next{text-align:right}.doc-footer{font-size:11px;color:#a18d7b;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:33px}.read-status{color:#8f7c6b}.toast{position:fixed;bottom:26px;left:calc(50% + 146px);transform:translateX(-50%);padding:10px 18px;background:#403329;color:#fff9f2;border-radius:8px;font-size:13px;box-shadow:0 4px 25px #42332224;z-index:50}.toast[hidden]{display:none}.backdrop{display:none}.mobile-close{display:none}.noscript{margin:30px;padding:20px;background:#fff3dc}.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 29px}.quick-links a{display:block;border:1px solid var(--line);border-radius:10px;padding:17px 18px;text-decoration:none;color:var(--text);background:#fffaf3}.quick-links a:hover{border-color:#d7a889;background:#fdf2e7}.quick-links b{font-size:14px;font-weight:600;display:block}.quick-links small{font-size:12px;color:#8c7663;display:block;margin-top:5px}.filter-hit{font-size:10px;color:#a67558;display:block;font-weight:400}.skip{position:absolute;top:-70px;left:12px;z-index:100;background:var(--paper);padding:8px}.skip:focus{top:6px}

<div class="app" id="app">

<div class="search-wrap"><label class="search-box"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" autocomplete="off" placeholder="搜索教程或命令…" aria-label="搜索所有教程"><span class="search-key">Ctrl K</span></label><div class="search-meta" id="search-meta" aria-live="polite" hidden></div></div>

<header class="topbar"><button class="menu-button" id="menu" aria-label="展开目录" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="breadcrumbs"><span class="site-crumb">使用文档</span><span class="sep site-crumb">/</span><span id="crumb-group"></span><span class="sep">/</span><span id="crumb-title"></span></div><div class="top-actions"><span class="offline">离线手册</span><button class="plain-button" id="print" aria-label="打印当前教程"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V8h16v9h-3M7 14h10v7H7zM17 11h.01"/></svg><span>打印本页</span></button></div></header>
<main class="reader" id="reader"><div class="content-layout"><article id="article" tabindex="-1"></article><aside class="toc" aria-label="本页目录"><strong>本页内容</strong><div class="toc-links" id="toc"></div></aside></div></main>

<script id="guide-data" type="application/json">__GUIDE_DATA__</script>
<script>
'use strict';
const pages=JSON.parse(document.getElementById('guide-data').textContent);
const byId=new Map(pages.map(p=>[p.id,p]));
const nav=document.getElementById('nav'), article=document.getElementById('article'), reader=document.getElementById('reader'), search=document.getElementById('search'), app=document.getElementById('app');
let currentId='',toastTimer,observer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>esc(s).replace(/(https?:\/\/[^\s<>]+)/g,'<a class="inline-link" href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const copyIcon='<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/></svg>';
const groups=[...new Set(pages.map(p=>p.group))];
const searchable=p=>[p.title,p.description,p.platform,...p.blocks.map(b=>[b.text,b.title,b.label,...(b.items||[]),...(b.headers||[]),...(b.rows||[]).flat()].filter(Boolean).join(' '))].join(' ').toLocaleLowerCase();
const searchIndex=new Map(pages.map(p=>[p.id,searchable(p)]));
function buildNav(){nav.innerHTML=groups.map((g,i)=>`<details class="nav-group" data-group="${i}" open><summary>${esc(g)}</summary><div class="nav-links">${pages.filter(p=>p.group===g).map(p=>`<a class="nav-link" href="#${esc(p.id)}" data-page="${esc(p.id)}">${esc(p.title)}</a>`).join('')}</div></details>`).join('')+'<p class="empty-search" id="empty-search" hidden>没有找到对应内容，试试“模型”“SSH”或“二维码”。</p>';}
function notify(message){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=message;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,2600);}
function closeMenu(){app.classList.remove('menu-open');document.getElementById('menu').setAttribute('aria-expanded','false');}
function blockHtml(b,i){switch(b.type){case'h2':return `<h2 id="part-${i}">${esc(b.text)}</h2>`;case'p':return `<p>${plain(b.text)}</p>`;case'note':return `<aside class="callout"><strong>${esc(b.title||'提示')}</strong><p>${plain(b.text)}</p></aside>`;case'code':return `<div class="code-block"><div class="code-top"><span>${esc(b.label||({bash:'Linux · Bash',powershell:'Windows · PowerShell',text:'填写内容'}[b.lang]||'代码'))}</span><button type="button" class="copy" data-copy="${i}" aria-label="复制${esc(b.label||'本段内容')}">${copyIcon}<span>复制</span></button></div><pre><code>${esc(b.text)}</code></pre></div>`;case'list':return `<ul>${b.items.map(x=>`<li>${plain(x)}</li>`).join('')}</ul>`;case'table':return `<div class="table-wrap"><table><thead><tr>${b.headers.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(row=>`<tr>${row.map(x=>`<td>${plain(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;default:return '';}}
function render(id){const page=byId.get(id)||byId.get('quickstart')||pages[0];currentId=page.id;document.title=page.title+' · Paseo 使用手册';document.getElementById('crumb-group').textContent=page.group;document.getElementById('crumb-title').textContent=page.title;
const idx=pages.indexOf(page),prev=pages[idx-1],next=pages[idx+1];
let quick='';if(page.id==='quickstart')quick='<div class="quick-links">'+[['models-missing','模型缺少 / 刷新无效','先检查同一主机上的模型列表'],['daily','已配置好，开始使用','日常启动、检查与项目选择'],['ssh-test','SSH 连接有问题','从无交互登录测试开始'],['mobile-pair','手机扫码连接','在 Linux 生成配对二维码']].filter(([id])=>byId.has(id)).map(([id,title,desc])=>`<a href="#${id}"><b>${title} <span aria-hidden="true">↗</span></b><small>${desc}</small></a>`).join('')+'</div>';
article.innerHTML=`<div class="eyebrow">${esc(page.group)}</div><h1>${esc(page.title)}</h1><p class="lead">${esc(page.description)}</p><div class="article-meta"><span class="platform">${esc(page.platform||'阅读说明')}</span><span>更新于 2026 年 10 月 20 日</span><span>第 ${idx+1} / ${pages.length} 篇</span></div>${quick}<div class="article-body">${page.blocks.map(blockHtml).join('')}</div><div class="page-nav">${prev?`<a href="#${prev.id}"><span>← 上一篇</span>${esc(prev.title)}</a>`:'<div></div>'}${next?`<a class="next" href="#${next.id}"><span>下一篇 →</span>${esc(next.title)}</a>`:'<div></div>'}</div><footer class="doc-footer"><span>Linux · Codex · CC-Switch · Paseo</span><span>单文件离线版 · 每次复制一段命令</span></footer>`;
nav.querySelectorAll('.nav-link').forEach(a=>{const active=a.dataset.page===page.id;a.toggleAttribute('aria-current',active);if(active){a.setAttribute('aria-current','page');a.closest('details').open=true;}});
const headings=page.blocks.map((b,i)=>({b,i})).filter(x=>x.b.type==='h2');document.getElementById('toc').innerHTML=headings.length?headings.map(({b,i})=>`<a href="#${page.id}/part-${i}" data-part="part-${i}">${esc(b.text)}</a>`).join(''):'<span style="font-size:12px;color:var(--muted)">本篇为快速说明</span>';
reader.scrollTop=0;if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{const first=entries.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(first)document.querySelectorAll('.toc a').forEach(a=>a.classList.toggle('active',a.dataset.part===first.target.id));},{root:reader,rootMargin:'-3% 0px -65% 0px'});article.querySelectorAll('h2').forEach(h=>observer.observe(h));closeMenu();}
function handleHash(){let parts;try{parts=decodeURIComponent(location.hash.slice(1)).split('/');}catch{parts=[];}const id=parts[0]||'quickstart';if(id==='article'){article.focus({preventScroll:true});return;}if(id!==currentId)render(id);if(parts[1])document.getElementById(parts[1])?.scrollIntoView({block:'start'});}
function filterNav(){const q=search.value.trim().toLocaleLowerCase();let count=0;nav.querySelectorAll('.nav-link').forEach(a=>{const found=!q||searchIndex.get(a.dataset.page).includes(q);a.hidden=!found;if(found)count++;});nav.querySelectorAll('.nav-group').forEach(d=>{d.hidden=![...d.querySelectorAll('.nav-link')].some(a=>!a.hidden);if(q)d.open=true;});document.getElementById('empty-search').hidden=count!==0;const meta=document.getElementById('search-meta');meta.hidden=!q;meta.textContent=`找到 ${count} 篇相关教程`;}
async function copyText(value,button){let copied=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);copied=true;}}catch{}if(!copied){const ta=document.createElement('textarea');ta.value=value;ta.style.cssText='position:fixed;left:-9999px;top:0;';document.body.appendChild(ta);ta.focus();ta.select();try{copied=document.execCommand('copy');}catch{}ta.remove();button.focus();}if(copied){button.querySelector('span').textContent='已复制';notify('已复制，可粘贴到对应终端');setTimeout(()=>{if(button.isConnected)button.querySelector('span').textContent='复制';},2000);}else{const code=button.closest('.code-block').querySelector('code');const range=document.createRange();range.selectNodeContents(code);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);notify('已选中内容，请按 Ctrl+C 复制');}}
article.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b)copyText(byId.get(currentId).blocks[Number(b.dataset.copy)].text,b);});
nav.addEventListener('click',e=>{if(e.target.closest('.nav-link'))closeMenu();});
document.getElementById('menu').addEventListener('click',()=>{const open=app.classList.toggle('menu-open');document.getElementById('menu').setAttribute('aria-expanded',String(open));});document.getElementById('backdrop').addEventListener('click',closeMenu);document.getElementById('print').addEventListener('click',()=>window.print());search.addEventListener('input',filterNav);search.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=[...nav.querySelectorAll('.nav-link')].find(a=>!a.hidden);if(a){location.hash=a.dataset.page;closeMenu();}}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(matchMedia('(max-width:800px)').matches){app.classList.add('menu-open');document.getElementById('menu').setAttribute('aria-expanded','true');}search.focus();search.select();}if(e.key==='Escape'){if(search.value){search.value='';filterNav();}closeMenu();}});window.addEventListener('hashchange',handleHash);buildNav();handleHash();
</script>
</body>
</html>
